<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>FYZ · fast food</title>
  <!-- Font Awesome for icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
    }

    body {
      background: #f8f6f2;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 12px;
    }

    /* main app card */
    .app {
      max-width: 420px;
      width: 100%;
      background: #ffffff;
      border-radius: 36px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
      overflow: hidden;
      padding: 20px 18px 18px;
      transition: all 0.2s;
      border: 1px solid rgba(255, 215, 0, 0.2);
    }

    /* header */
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .logo i {
      font-size: 32px;
      color: #e63946;
      filter: drop-shadow(0 4px 6px rgba(230, 57, 70, 0.2));
    }

    .logo h1 {
      font-size: 26px;
      font-weight: 800;
      letter-spacing: -0.5px;
      color: #1e1e2a;
    }

    .logo h1 span {
      color: #e63946;
    }

    .cart-icon {
      background: #f1f1f1;
      width: 48px;
      height: 48px;
      border-radius: 30px;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      cursor: pointer;
      transition: 0.2s;
      box-shadow: 0 2px 8px rgba(0,0,0,0.02);
    }

    .cart-icon i {
      font-size: 22px;
      color: #2b2b3a;
    }

    .cart-badge {
      position: absolute;
      top: -4px;
      right: -4px;
      background: #e63946;
      color: white;
      font-weight: 700;
      font-size: 12px;
      min-width: 20px;
      height: 20px;
      border-radius: 30px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0 5px;
      border: 2px solid white;
    }

    /* greeting / tagline */
    .tagline {
      margin-bottom: 18px;
    }

    .tagline h2 {
      font-size: 22px;
      font-weight: 700;
      color: #1e1e2a;
    }

    .tagline p {
      color: #7a7a8c;
      font-size: 15px;
      font-weight: 500;
      margin-top: 4px;
    }

    /* search */
    .search-bar {
      background: #f1f1f1;
      border-radius: 40px;
      padding: 12px 18px;
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 22px;
      transition: 0.2s;
      border: 1px solid transparent;
    }

    .search-bar i {
      color: #9c9caf;
      font-size: 18px;
    }

    .search-bar input {
      border: none;
      background: transparent;
      width: 100%;
      font-size: 16px;
      font-weight: 500;
      outline: none;
      color: #1e1e2a;
    }

    .search-bar input::placeholder {
      color: #aaaabb;
      font-weight: 400;
    }

    /* category chips */
    .categories {
      display: flex;
      gap: 10px;
      margin-bottom: 22px;
      overflow-x: auto;
      padding-bottom: 6px;
      scrollbar-width: none;
    }

    .categories::-webkit-scrollbar {
      display: none;
    }

    .chip {
      background: #f1f1f1;
      padding: 10px 20px;
      border-radius: 40px;
      font-weight: 600;
      font-size: 14px;
      white-space: nowrap;
      color: #3a3a4a;
      transition: all 0.15s;
      cursor: pointer;
      border: 1px solid transparent;
    }

    .chip.active {
      background: #e63946;
      color: white;
      box-shadow: 0 8px 14px -6px rgba(230, 57, 70, 0.4);
    }

    .chip i {
      margin-right: 6px;
      font-size: 13px;
    }

    /* section title */
    .section-title {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      margin-bottom: 14px;
    }

    .section-title h3 {
      font-size: 18px;
      font-weight: 700;
      color: #1e1e2a;
    }

    .section-title a {
      font-size: 14px;
      font-weight: 600;
      color: #e63946;
      text-decoration: none;
      cursor: default;
    }

    /* menu grid */
    .menu-grid {
      display: flex;
      flex-direction: column;
      gap: 14px;
      margin-bottom: 22px;
      max-height: 380px;
      overflow-y: auto;
      padding-right: 4px;
      scrollbar-width: thin;
    }

    .menu-grid::-webkit-scrollbar {
      width: 4px;
    }

    .menu-grid::-webkit-scrollbar-thumb {
      background: #ddd;
      border-radius: 10px;
    }

    .menu-item {
      display: flex;
      background: #ffffff;
      border-radius: 24px;
      padding: 14px 16px;
      align-items: center;
      gap: 14px;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.02);
      border: 1px solid #f0f0f5;
      transition: all 0.15s;
      cursor: default;
    }

    .menu-item:hover {
      border-color: #ffe0e2;
      background: #fffcfc;
    }

    .item-emoji {
      font-size: 38px;
      background: #fef3e9;
      width: 64px;
      height: 64px;
      border-radius: 30px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      box-shadow: 0 4px 8px rgba(0,0,0,0.02);
    }

    .item-info {
      flex: 1;
    }

    .item-info h4 {
      font-size: 17px;
      font-weight: 700;
      color: #1e1e2a;
      letter-spacing: -0.2px;
    }

    .item-info .desc {
      font-size: 12px;
      color: #8b8b9e;
      font-weight: 500;
      margin: 2px 0 6px;
    }

    .price-add {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .price {
      font-size: 17px;
      font-weight: 800;
      color: #e63946;
    }

    .add-btn {
      background: #e63946;
      border: none;
      border-radius: 40px;
      padding: 8px 16px;
      display: flex;
      align-items: center;
      gap: 6px;
      color: white;
      font-weight: 700;
      font-size: 13px;
      cursor: pointer;
      transition: all 0.15s;
      box-shadow: 0 6px 14px -4px rgba(230, 57, 70, 0.4);
    }

    .add-btn i {
      font-size: 12px;
    }

    .add-btn:active {
      transform: scale(0.94);
      background: #c22d3a;
    }

    /* cart summary (footer) */
    .cart-summary {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-top: 14px;
      border-top: 2px dashed #eaeaf0;
      margin-top: 6px;
    }

    .cart-total {
      display: flex;
      flex-direction: column;
    }

    .cart-total span:first-child {
      font-size: 13px;
      color: #8b8b9e;
      font-weight: 600;
      letter-spacing: 0.3px;
    }

    .cart-total .total-amount {
      font-size: 24px;
      font-weight: 800;
      color: #1e1e2a;
    }

    .checkout-btn {
      background: #1e1e2a;
      color: white;
      border: none;
      border-radius: 40px;
      padding: 14px 28px;
      font-weight: 700;
      font-size: 16px;
      display: flex;
      align-items: center;
      gap: 10px;
      cursor: pointer;
      transition: all 0.2s;
      box-shadow: 0 10px 22px -8px rgba(0, 0, 0, 0.3);
    }

    .checkout-btn i {
      font-size: 16px;
    }

    .checkout-btn:active {
      transform: scale(0.96);
      background: #0f0f1a;
    }

    /* toast message */
    .toast-message {
      position: fixed;
      bottom: 40px;
      left: 50%;
      transform: translateX(-50%);
      background: #1e1e2a;
      color: white;
      padding: 12px 24px;
      border-radius: 50px;
      font-weight: 600;
      font-size: 14px;
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.3);
      z-index: 999;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s;
      white-space: nowrap;
    }

    .toast-message.show {
      opacity: 1;
    }

    /* empty cart special */
    .cart-icon .cart-badge.hidden {
      display: none;
    }
  </style>
</head>
<body>
  <div class="app">
    <!-- Header -->
    <div class="header">
      <div class="logo">
        <i class="fas fa-bolt"></i>
        <h1><span>FYZ</span> fast</h1>
      </div>
      <div class="cart-icon" id="cartIcon">
        <i class="fas fa-shopping-bag"></i>
        <span class="cart-badge" id="cartBadge">0</span>
      </div>
    </div>

    <!-- Tagline -->
    <div class="tagline">
      <h2>Crave. Click. Devour.</h2>
      <p>⚡ hot & fresh, delivered fast</p>
    </div>

    <!-- Search -->
    <div class="search-bar">
      <i class="fas fa-search"></i>
      <input type="text" placeholder="Search burgers, fries, shakes..." id="searchInput">
    </div>

    <!-- Category chips (static for style) -->
    <div class="categories">
      <div class="chip active"><i class="fas fa-fire"></i> Popular</div>
      <div class="chip"><i class="fas fa-hamburger"></i> Burgers</div>
      <div class="chip"><i class="fas fa-french-fries"></i> Sides</div>
      <div class="chip"><i class="fas fa-ice-cream"></i> Shakes</div>
    </div>

    <!-- Menu section title -->
    <div class="section-title">
      <h3>🔥 Hot right now</h3>
      <a href="#">See all</a>
    </div>

    <!-- Menu grid (dynamic items) -->
    <div class="menu-grid" id="menuGrid">
      <!-- items will be injected via JS -->
    </div>

    <!-- Cart summary -->
    <div class="cart-summary">
      <div class="cart-total">
        <span>YOUR TOTAL</span>
        <span class="total-amount" id="totalAmount">$0.00</span>
      </div>
      <button class="checkout-btn" id="checkoutBtn">
        <i class="fas fa-bag-shopping"></i> Checkout
      </button>
    </div>
  </div>

  <!-- toast -->
  <div class="toast-message" id="toast"></div>

  <script>
    (function() {
      // ---------- MENU DATA ----------
      const menuItems = [
        { id: 1, name: 'FYZ Double Smash', desc: 'two beef patties, cheddar, house sauce', price: 8.90, emoji: '🍔' },
        { id: 2, name: 'Crispy Chicken Deluxe', desc: 'buttermilk fried chicken, pickles, mayo', price: 7.50, emoji: '🍗' },
        { id: 3, name: 'Loaded Fries', desc: 'cheese sauce, bacon bits, green onions', price: 4.80, emoji: '🍟' },
        { id: 4, name: 'Vanilla Bean Shake', desc: 'real vanilla, whipped cream, cherry', price: 4.20, emoji: '🥤' },
        { id: 5, name: 'Spicy Beyond Burger', desc: 'plant-based patty, jalapeño, vegan cheese', price: 9.30, emoji: '🌶️' },
        { id: 6, name: 'Onion Rings (8pcs)', desc: 'beer-battered, crispy, ranch dip', price: 3.90, emoji: '🧅' },
        { id: 7, name: 'Choco Lava Cake', desc: 'warm molten center, vanilla ice cream', price: 5.20, emoji: '🍫' },
        { id: 8, name: 'FYZ Classic Cola', desc: 'ice-cold, 16oz', price: 2.20, emoji: '🥤' }
      ];

      // cart state: array of { id, name, price, emoji, quantity }
      let cart = [];

      // DOM elements
      const menuGrid = document.getElementById('menuGrid');
      const cartBadge = document.getElementById('cartBadge');
      const totalAmountSpan = document.getElementById('totalAmount');
      const toastEl = document.getElementById('toast');
      const checkoutBtn = document.getElementById('checkoutBtn');
      const searchInput = document.getElementById('searchInput');
      const cartIcon = document.getElementById('cartIcon');

      // ---------- RENDER MENU (with optional filter) ----------
      function renderMenu(filterText = '') {
        const searchTerm = filterText.trim().toLowerCase();
        const filtered = searchTerm === '' 
          ? menuItems 
          : menuItems.filter(item => 
              item.name.toLowerCase().includes(searchTerm) || 
              item.desc.toLowerCase().includes(searchTerm)
            );

        if (filtered.length === 0) {
          menuGrid.innerHTML = `<div style="text-align:center; padding:30px 0; color:#9c9caf; font-weight:500;">
            <i class="fas fa-search" style="font-size:28px; margin-bottom:10px; opacity:0.6;"></i><br>
            No items match "${filterText}"
          </div>`;
          return;
        }

        let html = '';
        filtered.forEach(item => {
          html += `
            <div class="menu-item" data-id="${item.id}">
              <div class="item-emoji">${item.emoji}</div>
              <div class="item-info">
                <h4>${item.name}</h4>
                <div class="desc">${item.desc}</div>
                <div class="price-add">
                  <span class="price">$${item.price.toFixed(2)}</span>
                  <button class="add-btn" data-id="${item.id}" data-name="${item.name}" data-price="${item.price}" data-emoji="${item.emoji}">
                    <i class="fas fa-plus"></i> Add
                  </button>
                </div>
              </div>
            </div>
          `;
        });
        menuGrid.innerHTML = html;

        // re-attach event listeners to the new add buttons
        document.querySelectorAll('.add-btn').forEach(btn => {
          btn.addEventListener('click', function(e) {
            e.stopPropagation();
            const id = parseInt(this.dataset.id);
            const name = this.dataset.name;
            const price = parseFloat(this.dataset.price);
            const emoji = this.dataset.emoji;
            addToCart(id, name, price, emoji);
          });
        });
      }

      // ---------- ADD TO CART ----------
      function addToCart(id, name, price, emoji) {
        const existing = cart.find(entry => entry.id === id);
        if (existing) {
          existing.quantity += 1;
        } else {
          cart.push({ id, name, price, emoji, quantity: 1 });
        }
        updateCartUI();
        showToast(`✅ ${name} added`);
      }

      // ---------- UPDATE CART (badge + total) ----------
      function updateCartUI() {
        const totalItems = cart.reduce((sum, entry) => sum + entry.quantity, 0);
        const totalPrice = cart.reduce((sum, entry) => sum + (entry.price * entry.quantity), 0);

        // update badge
        cartBadge.textContent = totalItems;
        if (totalItems === 0) {
          cartBadge.classList.add('hidden');
        } else {
          cartBadge.classList.remove('hidden');
        }

        // update total amount
        totalAmountSpan.textContent = `$${totalPrice.toFixed(2)}`;
      }

      // ---------- TOAST ----------
      let toastTimeout;
      function showToast(message) {
        toastEl.textContent = message;
        toastEl.classList.add('show');
        clearTimeout(toastTimeout);
        toastTimeout = setTimeout(() => {
          toastEl.classList.remove('show');
        }, 1800);
      }

      // ---------- CHECKOUT (simulated) ----------
      function handleCheckout() {
        if (cart.length === 0) {
          showToast('🛒 Your cart is empty — add something tasty!');
          return;
        }
        const totalItems = cart.reduce((sum, e) => sum + e.quantity, 0);
        const totalPrice = cart.reduce((sum, e) => sum + (e.price * e.quantity), 0);
        showToast(`⚡ Order placed! ${totalItems} item${totalItems > 1 ? 's' : ''} · $${totalPrice.toFixed(2)}`);
        // clear cart after checkout
        cart = [];
        updateCartUI();
      }

      // ---------- CART ICON CLICK (show items) ----------
      function showCartDetails() {
        if (cart.length === 0) {
          showToast('🛍️ Your cart is empty');
          return;
        }
        // build summary message
        const totalItems = cart.reduce((sum, e) => sum + e.quantity, 0);
        const totalPrice = cart.reduce((sum, e) => sum + (e.price * e.quantity), 0);
        const itemsList = cart.map(e => `${e.quantity}× ${e.name}`).join(', ');
        showToast(`🛒 ${itemsList} = $${totalPrice.toFixed(2)}`);
      }

      // ---------- SEARCH FILTER ----------
      searchInput.addEventListener('input', function(e) {
        renderMenu(e.target.value);
      });

      // ---------- CHECKOUT LISTENER ----------
      checkoutBtn.addEventListener('click', handleCheckout);

      // ---------- CART ICON CLICK ----------
      cartIcon.addEventListener('click', showCartDetails);

      // ---------- INITIAL RENDER ----------
      renderMenu();
      updateCartUI();   // set badge hidden & total 0.00

      // ---------- EXTRA: clear search on load maybe? fine. ----------
      // Also to make the "Popular" chip look active, it's static in HTML.
      // (We don't implement category filtering to keep it simple, but it's a visual.)

      // small extra: click on chips just switches active class for demo
      const chips = document.querySelectorAll('.chip');
      chips.forEach(chip => {
        chip.addEventListener('click', function() {
          chips.forEach(c => c.classList.remove('active'));
          this.classList.add('active');
          // For simplicity we don't change the menu list, but we could show a toast.
          showToast(`🍔 ${this.innerText.trim()} selected (demo)`);
        });
      });

      // ensure badge hidden when count 0
      // already handled in updateCartUI

      // Pre-fill badge hidden initially (since cart empty)
      // but updateCartUI called anyway.
    })();
  </script>
</body>
</html>
